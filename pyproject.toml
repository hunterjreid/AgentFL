[project]
name = "agentfl"
version = "0.1.0"
description = "Drive FL Studio the way an agent drives a browser: inject, read, see, point."
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "Pillow>=10.0",
]

[project.scripts]
agentfl-doctor = "agentfl.doctor:main"
agentfl-probe = "agentfl.probe:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentfl"]
